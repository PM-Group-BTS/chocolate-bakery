<div class="register-container">
  <h2>Register</h2>
  <form (ngSubmit)="onSubmit()" #registerForm="ngForm" autocomplete="off">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required minlength="4" [(ngModel)]="username" #usernameInput="ngModel">
    <div *ngIf="usernameInput.invalid && (usernameInput.dirty || usernameInput.touched)" class="error-message">
      <div *ngIf="usernameInput.errors?.['required']">Username is required.</div>
      <div *ngIf="usernameInput.errors?.['minlength']">Username must be at least 4 characters.</div>
    </div>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required [(ngModel)]="email" #emailInput="ngModel">
    <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="error-message">
      <div *ngIf="emailInput.errors?.['required']">Email is required.</div>
      <div *ngIf="emailInput.errors?.['email']">Invalid email address.</div>
    </div>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="6" [(ngModel)]="password" #passwordInput="ngModel">
    <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="error-message">
      <div *ngIf="passwordInput.errors?.['required']">Password is required.</div>
      <div *ngIf="passwordInput.errors?.['minlength']">Password must be at least 6 characters.</div>
    </div>

    <button type="submit" [disabled]="registerInProgress">Register</button>
  </form>
  <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
</div>
